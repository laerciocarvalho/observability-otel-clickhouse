# OpenTelemetry Collector configuration
# Sends traces, metrics and logs to ClickHouse Cloud (or local ClickHouse)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 5000
    send_batch_max_size: 10000

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  resource:
    attributes:
      - key: collector.name
        value: otel-collector-portfolio
        action: upsert

exporters:
  # ClickHouse exporter (contrib)
  # Replace the endpoint/credentials with your ClickHouse Cloud values
  clickhouse:
    endpoint: ${CLICKHOUSE_ENDPOINT}          # e.g. clickhouse://xxxx.clickhouse.cloud:9440?secure=true
    database: ${CLICKHOUSE_DATABASE}
    username: ${CLICKHOUSE_USERNAME}
    password: ${CLICKHOUSE_PASSWORD}
    async_insert: true
    ttl: 168h                                 # 7 days (adjust for free tier)
    compress: lz4
    create_schema: true
    timeout: 10s
    traces_table_name: otel_traces
    logs_table_name: otel_logs
    metrics_tables:
      gauge:
        name: otel_metrics_gauge
      sum:
        name: otel_metrics_sum
      summary:
        name: otel_metrics_summary
      histogram:
        name: otel_metrics_histogram
      exponential_histogram:
        name: otel_metrics_exp_histogram
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Useful while developing – prints to collector stdout
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [clickhouse, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [clickhouse, debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [clickhouse, debug]

  telemetry:
    logs:
      level: info
